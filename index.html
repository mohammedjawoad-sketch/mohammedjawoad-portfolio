<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mohammed Jawoad | SAP Consultant & Full-Stack Developer, Baghdad</title>
    <meta name="description" content="SAP consultant, full-stack developer, system administrator and IT consultant in Baghdad, Iraq." />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Theme before first paint: ?theme= in the link, else the visitor's saved
      // choice, else dark. The social preview capture (?og) is always dark.
      ;(function () {
        var theme = 'dark'
        try {
          var params = new URLSearchParams(location.search)
          var asked = params.get('theme')
          var saved = localStorage.getItem('theme')
          if (!params.has('og')) {
            if (asked === 'light' || asked === 'dark') theme = asked
            else if (saved === 'light' || saved === 'dark') theme = saved
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6fb')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Search and social tags for each language are written here by scripts/prerender.mjs. -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
